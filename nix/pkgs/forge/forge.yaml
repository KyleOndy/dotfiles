network: forge

mirrors:
  - name: dockerio
    upstream: https://registry-1.docker.io
  - name: ghcrio
    upstream: https://ghcr.io
  - name: quayio
    upstream: https://quay.io

management:
  name: forge-mgmt
  argocd:
    version: "9.4.7"
  nodes:
    - role: control-plane

kubeconfig: ~/.local/state/forge/kubeconfig.yaml

clusters:
  - name: forge-1
    nodes:
      - role: control-plane
      - role: worker
  - name: forge-2
    nodes:
      - role: control-plane
      - role: worker
