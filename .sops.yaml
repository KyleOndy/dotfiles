---
keys:
  # user keys
  - &kyle 3C799D26057B64E6D907B0ACDB0E3C33491F91C9 # yubikey

  # machine keys
  - &cogsworth age1am5p2xzksgsh93zgnznfp3rxpn69wexql9nyjl4ng7qeu386qvjq3pk2vy

  - &tiger age1mcse3suy7qxr7pxn262zw67lrz2wyl8pr6hgqs5x0fk5p0w7qa4s9lnctc

  - &trex age1ckcr5cc6g9nmfhhhwud0jkpjvfpz8lhsa7kdsshqmh5cfcma4qhse3vcak

  # Derived from a host key generated on trex and installed via
  # nixos-anywhere --extra-files, so it is enrolled before pika's first
  # activation rather than after it fails on monitoring_password.
  - &pika age1kxl2n6kvy48gjwyqg6gsa3mm493m3npm6dwam2r3k36jhqtlf93qmmjrtj

  # command to add a new age key for a new host
  # nix-shell -p ssh-to-age --run "ssh-keyscan $host | ssh-to-age"
  # then add it to its own rule below, and run updatekeys on each file whose
  # rule changed: sops updatekeys ./nix/secrets/<file>.yaml
#
# One file per host, plus one shared-<hosts>.yaml per recipient set that
# more than one host needs. A host holds ciphertext only for the files its
# own config references, and can decrypt only the ones listed for it here.
creation_rules:
  - path_regex: nix/secrets/tiger\.yaml$
    key_groups:
      - age:
          - *tiger
        pgp:
          - *kyle
  - path_regex: nix/secrets/pika\.yaml$
    key_groups:
      - age:
          - *pika
        pgp:
          - *kyle
  - path_regex: nix/secrets/cogsworth\.yaml$
    key_groups:
      - age:
          - *cogsworth
        pgp:
          - *kyle
  - path_regex: nix/secrets/trex\.yaml$
    key_groups:
      - age:
          - *trex
        pgp:
          - *kyle
  # monitoring_password: the agents that push to tiger
  - path_regex: nix/secrets/shared-cogsworth-pika-trex\.yaml$
    key_groups:
      - age:
          - *cogsworth
          - *pika
          - *trex
        pgp:
          - *kyle
  # kyle_password_hash: every NixOS host (nix_modules/users/kyle.nix)
  - path_regex: nix/secrets/shared-cogsworth-pika-tiger\.yaml$
    key_groups:
      - age:
          - *cogsworth
          - *pika
          - *tiger
        pgp:
          - *kyle
  # unpoller_password: tiger's unpoller and cogsworth's kiosk
  - path_regex: nix/secrets/shared-cogsworth-tiger\.yaml$
    key_groups:
      - age:
          - *cogsworth
          - *tiger
        pgp:
          - *kyle
  # smb_kyle_password: tiger's smbd and trex's smb-tiger-mount
  - path_regex: nix/secrets/shared-tiger-trex\.yaml$
    key_groups:
      - age:
          - *tiger
          - *trex
        pgp:
          - *kyle
  # Any other file under nix/secrets, including keys no host references:
  # readable by Kyle alone until a rule above claims it.
  - path_regex: nix/secrets/[^/]+\.yaml$
    key_groups:
      - pgp:
          - *kyle
  - path_regex: nix/hosts/cogsworth/keys/.*\.sops$
    key_groups:
      - age:
          - *cogsworth
        pgp:
          - *kyle
