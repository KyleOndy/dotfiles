[extend]
useDefault = true

# No git-crypt paths: secrets-check scans stored bytes, so those are ciphertext.
[allowlist]
description = "sops values and metadata, and a public GPG fingerprint"
regexTarget = "line"
regexes = [
  # A plaintext value in a sops file has no ENC[ on its line, so it is scanned.
  '''ENC\[AES256_GCM,''',
  # kyle's public GPG (YubiKey) fingerprint, used as a gpg-sign `key =`
  # setting in email.nix. Same public key ID as .sops.yaml; not a secret.
  '''3C799D26057B64E6D907B0ACDB0E3C33491F91C9''',
]
